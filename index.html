P.x=S.x;P.z=S.z;yaw=S.yaw;pitch=0;P.y=(S.cave?CY:H(S.x,S.z))+1.7;vy=0;seq=[];if(!S.cave&&!isNew&&S.y>P.y)P.y=S.y;
$('title').classList.remove('on');if(cur)$(cur).classList.remove('on');cur=null;$('hud').style.display='block';mode='play';lock();save();if(isNew)toast('바닷물에 젖은 몸을 일으킨다… 난파된 배 쪽을 살펴보자.')}

$('pR').onclick=closeUI;$('pN').onclick=()=>begin(true);$('eN').onclick=()=>begin(true);$('iU').onclick=useItem;$('iC').onclick=closeUI;$('mX').onclick=closeUI;

const gnd=(x,z)=>S.cave?CY:H(x,z);
function ok(x,z){if(S.cave){if(Math.abs(x-CX)>9.4||z>CZ+4.4||z<CZ-69.4)return false}else if(H(x,z)<-.8)return false;
if(gnd(x,z)-(P.y-1.7)>1.1&&onG)return false;for(const c of COL){if(c===rgc&&S.f.gate||c===cgc&&S.f.lv)continue;if(x>c.x1-.35&&x<c.x2+.35&&z>c.z1-.35&&z<c.z2+.35)return false}return true}
let best=null;const v3=new T.Vector3(),tC=new T.Color(),cFog=new T.Color(),cA=new T.Color(0x9fd8d6),cB=new T.Color(0x2e5a4a);
const clock=new T.Clock();

function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;U.time.value=t;
// water
for(let i=0;i<wp.count;i++){const x=wp.getX(i),z=wp.getZ(i);wp.setY(i,Math.sin(x*.15+t*1.2)*.12+Math.cos(z*.12+t*1.5)*.1+Math.sin((x+z)*.3+t*2)*.04)}wp.needsUpdate=true;
if(mode==='title'){const a=t*.06;cam.position.set(Math.sin(a)*25-5,10,108);cam.lookAt(0,4,40);cam.rotation.z=0;sun.position.set(30,60,60);sun.target.position.set(0,0,60);P.x=0;P.z=70;mood(dt,t);ren.render(scene,cam);return}
if(mode==='play'){const f=(k.KeyW?1:0)-(k.KeyS?1:0),s=(k.KeyD?1:0)-(k.KeyA?1:0),run=k.ShiftLeft||k.ShiftRight;let dx=-Math.sin(yaw)*f+Math.cos(yaw)*s,dz=-Math.cos(yaw)*f-Math.sin(yaw)*s;const l=Math.hypot(dx,dz);
if(l>0){const sp=(run?7.5:4.2)*dt/l;const nx=P.x+dx*sp,nz=P.z+dz*sp;if(ok(nx,P.z))P.x=nx;if(ok(P.x,nz))P.z=nz;bobT+=dt*(run?11:8);const sn=Math.sin(bobT)>0?1:0;if(sn!==prevS&&onG){prevS=sn;step()}}
if(k.Space&&onG){vy=6.2;onG=false}vy-=18*dt;P.y+=vy*dt;const gy=gnd(P.x,P.z)+1.7;if(P.y<=gy){P.y=gy;vy=0;onG=true}else if(P.y>gy+.05)onG=false}
const bob=mode==='play'&&onG?Math.sin(bobT)*.045:0;cam.position.set(P.x,P.y+bob,P.z);cam.rotation.set(pitch,yaw,0);sky.position.copy(cam.position);sky.visible=!S.cave;
sun.position.set(P.x+35,P.y+60,P.z+25);sun.target.position.set(P.x,P.y,P.z);
mood(dt,t);
// props
PK.forEach(([m,f])=>m.visible=!S.f[f]);
rg.position.y+=((S.f.gate?rg.userData.y0-5.2:rg.userData.y0)-rg.position.y)*Math.min(1,dt*1.5);cgate.position.y+=((S.f.lv?9:3.5)-cgate.position.y)*Math.min(1,dt*1.5);
lid.rotation.x+=((S.f.chest?-1.9:0)-lid.rotation.x)*Math.min(1,dt*3);gold.intensity=S.cave&&S.f.chest?3+Math.sin(t*5):S.cave?.6:0;
for(const x of['plank','rope','part'])bp[x].visible=!!S.f['s_'+x];if(S.f.s_hammer)boat.traverse(o=>{if(o.userData.sail)o.visible=true});
const fk=1+Math.sin(t*20)*.2+Math.sin(t*13)*.15;flame.scale.set(fk,fk*1.2,fk);fl2.scale.set(1/fk,fk,1/fk);fire.intensity=2*fk;FL.forEach((m,i)=>m.scale.setScalar(.9+Math.sin(t*18+i)*.2));
hand.visible=!!S.torch&&has('torch');tl.intensity=hand.visible?1.8*(.9+Math.sin(t*17)*.1+Math.sin(t*9)*.08):0;
anim.forEach(a=>a(dt));
for(let i=0;i<PN;i++){const j=i*3;pa2[j]+=Math.sin(t+i)*dt*.3;pa2[j+1]+=Math.cos(t*.7+i*2)*dt*.2;pa2[j+2]+=Math.cos(t*.5+i)*dt*.3;for(let a=0;a<3;a+=2){const c=a?P.z:P.x;if(pa2[j+a]-c>25)pa2[j+a]-=50;if(pa2[j+a]-c<-25)pa2[j+a]+=50}const gyy=gnd(pa2[j],pa2[j+2]);if(pa2[j+1]<gyy+.3||pa2[j+1]>gyy+6)pa2[j+1]=gyy+.5+R()*4}
pg.attributes.position.needsUpdate=true;
// interaction
best=null;if(mode==='play'){let bs=1e9;const fx=-Math.sin(yaw),fz=-Math.cos(yaw);for(const it of IA){const lb=it.t();if(!lb)continue;const ex=it.x-P.x,ez=it.z-P.z,d=Math.hypot(ex,ez);if(d>it.r)continue;if(d>1.2&&(ex*fx+ez*fz)/d<.35)continue;if(d<bs){bs=d;best=it;best.lb=lb}}}
const pr=$('pr');if(best){pr.style.display='block';pr.textContent='[E] '+best.lb}else pr.style.display='none';
if(mode==='play'){const c=chap();$('cht').textContent=CHS[c][0];$('goal').textContent=(c==2&&S.f.altar||c==3&&!S.cave&&false)?'':(c==3&&!S.cave?'동굴 입구(지도의 ✕)로 가서 동굴로 들어가라':CHS[c][1]);$('cmp').style.display=has('compass')?'block':'none';$('ring').style.transform='rotate('+(yaw*57.3)+'deg)';$('deg').textContent=['북','북서','서','남서','남','남동','동','북동'][Math.round(((yaw%6.283)+6.283)%6.283/.7854)%8]}
if(AC){const cv=S.cave,sh=cv?0:cl((P.z-30)/50,0,1);amb.wave.gain.value+=((sh*.16*(.6+.4*Math.sin(t*.7)))-amb.wave.gain.value)*.1;amb.wind.gain.value+=(((cv?.02:.05)*(1+Math.sin(t*.3)))-amb.wind.gain.value)*.1;ev.gain.value=cv?.45:0;
if(!cv&&R()<dt*.5&&P.z<50){const f=2200+R()*1500;tone(f,.12,'sine',.05,f*1.4);setTimeout(()=>tone(f*1.1,.1,'sine',.04,f*1.5),140)}}
ren.render(scene,cam)}
function mood(dt,t,lvl){const cv=S.cave&&mode!=='title',jf=mode==='title'?0:cl((70-P.z)/110,0,1),ds=.5+.5*Math.sin(t*.03),a=Math.min(1,dt*2);
if(cv){cFog.set(0x020205);scene.fog.density+=(.075-scene.fog.density)*a;hemi.intensity+=(.14-hemi.intensity)*a;sun.intensity=0}
else{cFog.copy(cA).lerp(cB,jf);scene.fog.density+=((.005+jf*.011)-scene.fog.density)*a;hemi.intensity+=((.95-jf*.4)-hemi.intensity)*a;sun.intensity+=((2.2-jf*.8)-sun.intensity)*a;sun.color.set(0xfff4dc).lerp(tC.set(0xffb070),ds*.45);skyU.t.value.set(0x2f86c9).lerp(tC.set(0x1c4a6a),jf);skyU.b.value.set(0xbfe9e6).lerp(tC.set(0x6a9a8a),jf)}
scene.fog.color.lerp(cFog,a);scene.background=scene.fog.color}
tick();
